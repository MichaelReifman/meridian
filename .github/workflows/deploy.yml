name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# The generated country data, flags and icons are all gitignored, so CI rebuilds them
# from source on every run. That makes the pipeline the single source of truth for what
# ships — there is no way for a stale committed artifact to reach production.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published precache manifest would leave installed
# PWAs fetching assets that no longer exist.
concurrency:
  group: pages
  cancel-in-progress: true

# Every action is on its current major, and all of them are Node 24 builds — the
# runner force-runs Node 20 actions on 24 and warns, which none of these trigger.
# The majors do not line up: configure-pages had to reach v6 because its v5 was
# itself a Node 20 build, and upload-pages-artifact is composite, so its Node 20
# warning came from the actions/upload-artifact it wraps rather than from itself.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-node v6 narrowed automatic caching to npm only, which is what we ask
      # for here, so the cache keeps working across the bump.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build country data and boundaries
        run: npm run data

      - name: Vendor flags
        run: npm run flags

      - name: Generate icons
        run: npm run icons

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Catches the failure mode that a green build cannot: an asset the app will ask
      # for at runtime that never made it into the service worker's precache.
      - name: Verify assets and precache
        run: npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + no user-scaling: the map owns pinch-zoom, not the browser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F2EDE1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Meridian — a daily geography deduction game. Click the map, get pulled closer with every wrong guess."
    />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
    <title>Meridian — daily geography deduction</title>
  </head>
  <body class="h-full bg-[#F2EDE1]">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
